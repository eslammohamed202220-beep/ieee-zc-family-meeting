<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a2d" />
    <meta name="description" content="IEEE Zewail City Student Branch — First Family Meeting 2026/27." />
    <title>IEEE ZC-SB — First Family Meeting 2026/27</title>
    <link rel="preload" href="%BASE_URL%fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%assets/ieee-zc-white.png" as="image" />
  </head>
  <body>
    <div id="app" class="app" data-tone="night">
      <div class="scene-viewport"><main id="scene" class="scene" aria-live="polite"></main></div>
      <header class="chrome chrome--top">
        <button id="home" class="brand" type="button" aria-label="Go to first slide"><img src="%BASE_URL%assets/ieee-zc-white.png" alt="IEEE Zewail City Student Branch" /></button>
        <div class="chrome__chapter"><span class="chrome__dash"></span><span id="chapter">OPENING</span></div>
        <div class="chrome__actions"><button id="overview-open" class="chrome__text" type="button" aria-label="Open slide overview">INDEX <span>↗</span></button><button id="fullscreen" class="chrome__icon" type="button" aria-label="Enter full screen">⛶</button></div>
      </header>
      <footer class="chrome chrome--bottom">
        <span class="chrome__edition">IEEE ZC-SB <span>·</span> 2026/27</span>
        <div class="progress"><span class="progress__track"><span id="progress-fill" class="progress__fill"></span></span><span id="count" class="progress__count">01 / 27</span></div>
        <div class="chrome__arrows"><button id="previous" type="button" aria-label="Previous slide">←</button><button id="next" type="button" aria-label="Next slide">→</button></div>
      </footer>
      <div id="transition" class="transition" aria-hidden="true"><div class="transition__mark"><img src="%BASE_URL%assets/ieee-zc-white.png" alt="" /></div></div>
      <div id="overview" class="overview" aria-hidden="true" inert><div class="overview__header"><div><span class="kicker">ALL 27 SCENES</span><h2>Choose a moment.</h2></div><button id="overview-close" type="button" aria-label="Close overview">✕</button></div><div id="overview-list" class="overview__list"></div></div>
      <div id="portrait-modal" class="portrait-modal" aria-hidden="true" inert><button id="portrait-close" type="button" aria-label="Close portrait">✕</button><div id="portrait-content"></div></div>
    </div>
    <script type="module" src="%BASE_URL%src/presentation.js"></script>
  </body>
</html>
